name: Générer les livrables du projet

on:
  workflow_dispatch:
  push:
    paths:
      - "ants.py"
      - "main.py"
      - "visualization.py"
      - "requirements.txt"
      - "inputs/**"
      - "tests/**"
      - "docs/*.md"
      - "tools/build_documents.py"
      - "tools/build_release.py"
      - ".github/workflows/build-project-assets.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Exécuter les tests
        run: python -m unittest discover -s tests -v

      - name: Générer les visualisations des trois cas
        run: |
          rm -rf outputs
          python main.py inputs

      - name: Générer PowerPoint, PDF et DOCX
        run: python tools/build_documents.py

      - name: Construire le ZIP complet
        run: python tools/build_release.py

      - name: Publier les livrables dans le repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs
          git add docs/*.pdf docs/*.docx docs/*.pptx release/*.zip
          if git diff --cached --quiet; then
            echo "Aucun livrable modifié."
          else
            git commit -m "Générer les livrables du projet"
            git push
          fi

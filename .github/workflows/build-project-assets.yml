name: Générer les livrables du projet

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 1. Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 2. Exécuter tous les tests (parseur, solveur, officiels, recherche exhaustive, visuels)
        run: python -m unittest discover -s tests -v

      - name: 3. Résoudre les 9 fourmilières officielles (échoue si une seule ne passe pas)
        run: |
          rm -rf outputs
          test "$(ls inputs/officiels/*.txt | wc -l)" -eq 9
          python main.py inputs/officiels --sans-visuels --quiet

      - name: 4 à 8. Solutions, graphes, frames, GIF et trafics cumulés
        run: |
          python main.py inputs/officiels --quiet
          python main.py inputs/exemples --quiet
          for f in inputs/officiels/*.txt inputs/exemples/*.txt; do
            dir="outputs/$(basename "$f" .txt)"
            for out in solution.txt graphe.png flow_cumule.png animation.gif stats.json etapes/etape_00.png; do
              test -s "$dir/$out" || { echo "manquant : $dir/$out"; exit 1; }
            done
          done

      - name: Statistiques de synthèse (results.csv / .json / .md, resultats.png)
        run: python tools/analyze_inputs.py

      - name: Démonstration plus court chemin seul vs max-flow (contre-exemple)
        run: |
          python tools/demo_algorithmes.py
          test -s outputs/demo_algorithmes/shortest_path_vs_flow.png

      - name: 9 et 10. Présentation, script oral et fiche de révision
        run: |
          python tools/build_documents.py
          python tools/build_presentation.py

      - name: 11. Archive ZIP complète
        run: python tools/build_release.py

      - name: Publier les livrables (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: livrables-une-vie-de-fourmi
          path: |
            outputs/
            docs/*.pptx
            docs/*.pdf
            docs/*.docx
            release/*.zip
          if-no-files-found: error
